[project]
name = "rsgiadapter"
dynamic = ["version"]
description = "An adapter for asgi to rsgi"
authors = [
    { name = "belingud", email = "im.victor@qq.com" },
]
dependencies = []
requires-python = ">=3.12,<4.0"
readme = "README.md"
license = { text = "BSD-3-Clause" }
keywords = [
    "asgi",
    "rsgi",
    "adapter",
    "asgi adapter",
    "rsgi adapter",
    "asgi to rsgi",
    "rsgi to asgi",
    "asyncio"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.optional-dependencies]
examples = [
    "setuptools>=70.0.0",
    "fastapi>=0.111.0",
    "granian[reload]>=1.4.1",
    "sanic>=23.12.1",
    "blacksheep>=2.0.7",
    "litestar>=2.9.0",
    "quart>=0.19.6",
    "django>=4.2.13",
    "falcon>=3.1.3",
    "tornado>=6.4.1",
]

[dependency-groups]
dev = [
    "uvicorn>=0.30.1",
    "bump2version>=1.0.1",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/belingud/rsgiadapter"

[tool.hatch.version]
path = "src/rsgiadapter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rsgiadapter"]

[tool.hatch.build.targets.sdist]
include = ["/src/rsgiadapter"]

[tool.pytest.ini_options]
addopts = "-rsxX -l --tb=short --strict --cov=rsgiadapter --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests/"]
python_files = ["test_*.py"]

[tool.coverage.run]
# protocol.py only holds typing templates consumed under TYPE_CHECKING, it
# is never executed at runtime
omit = ["src/rsgiadapter/protocol.py"]
